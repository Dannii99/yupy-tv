<nz-layout class="min-h-screen bg-background-dark">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Area -->
  <nz-layout 
    class="bg-background-dark min-h-screen flex flex-col transition-all duration-300"
    [class.sm:ml-64]="!isSidebarCollapsed()"
    [class.sm:ml-20]="isSidebarCollapsed()"
  >
    <!-- Header -->
    <app-header></app-header>

    <!-- Main Content Area -->
    <nz-content class="flex-1 p-6 overflow-x-hidden">
      <!-- Router Outlet for nested routes -->
      <div class="max-w-7xl mx-auto h-full">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>

<div class="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-6">
  <!-- Tailwind + NG-ZORRO Card Example -->
  <nz-card class="w-full max-max-w-md shadow-xl rounded-2xl overflow-hidden border-none" [nzBordered]="false">
    <div class="p-4">
      <h2 class="text-2xl font-bold text-indigo-600 mb-2">Tailwind v4 + NG-ZORRO</h2>
      <p class="text-gray-600 mb-6">
        Esta es una demostración de que la configuración de Tailwind CSS v4 está funcionando
        correctamente junto con los componentes de NG-ZORRO.
      </p>

      <div class="flex gap-4">
        <button nz-button nzType="primary" class="bg-indigo-600 hover:bg-indigo-700 border-none rounded-lg h-10 px-6">
          Botón Primario
        </button>
        
        <button nz-button nzType="default" class="border-gray-300 text-gray-700 hover:text-indigo-600 rounded-lg h-10 px-6">
          Botón Secundario
        </button>
      </div>
    </div>
  </nz-card>

  <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-4xl">
    <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
      <p class="font-semibold text-gray-800">Tailwind v4</p>
      <p class="text-sm text-gray-500">Motor CSS-first activo</p>
    </div>
    <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
      <p class="font-semibold text-gray-800">Angular 21</p>
      <p class="text-sm text-gray-500">Standalone components</p>
    </div>
    <div class="bg-white p-4 rounded-lg shadow border-l-4 border-orange-500">
      <p class="font-semibold text-gray-800">SCSS</p>
      <p class="text-sm text-gray-500">Soporte completo habilitado</p>
    </div>
  </div>
</div>

<router-outlet />
